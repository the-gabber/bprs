name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CTEST_NO_TESTS_ACTION: error

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Clang
      uses: egor-tensin/setup-clang@v2
      with:
        version: latest

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Build
      env:
          CC: clang
          CXX: clang++
      run: cmake --build ${{github.workspace}}/build --config Debug

    - name: Test
      env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/build/coverage-%p.profraw"
      working-directory: ${{github.workspace}}/build
      run: ctest -C Debug --output-on-failure

    - name: Generate coverage report
      run: |
          llvm-profdata merge -sparse ${{ github.workspace }}/build/coverage-*.profraw -o ${{ github.workspace }}/build/coverage.profdata
          llvm-cov export \
            $(find ${{ github.workspace }}/build -type f -executable) \
            -instr-profile=${{ github.workspace }}/build/coverage.profdata \
            -format=lcov \
            -ignore-filename-regex='(/usr/.*|.*/tests/.*)' \
            > coverage.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
          files: ./coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true